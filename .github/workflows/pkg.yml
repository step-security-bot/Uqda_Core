name: Packages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pkg.yml"
      - "contrib/**"
      - "build"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vendored-sources:
    name: Vendored Sources

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build archive
        run: |
          NAME="$(sh contrib/semver/name.sh)"
          VERSION="$(sh contrib/semver/version.sh --bare)"
          go mod vendor && tar --exclude-vcs --no-xattrs \
            --exclude="${NAME}-${VERSION}-vendored.tar.gz" \
            -czf "${NAME}-${VERSION}-vendored.tar.gz" *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vendored sources
          path: "*.tar.gz"
          if-no-files-found: error

  build-packages-debian:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["amd64", "i386", "mips", "mipsel", "armhf", "armel", "arm64"]

    name: Package (Debian, ${{ matrix.pkgarch }})

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/deb/generate.sh

      - name: Inspect package
        run: |
          package=$(find . -maxdepth 1 -name 'uqda-*.deb' -print -quit)
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -E 'usr/bin/(uqda|uqdactl)$'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Debian package (${{ matrix.pkgarch }})
          path: "*.deb"
          if-no-files-found: error

  build-packages-macos:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["amd64", "arm64"]

    name: Package (macOS, ${{ matrix.pkgarch }})

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/macos/create-pkg.sh

      - name: Inspect package
        run: |
          package=$(find . -maxdepth 1 -name 'uqda-*.pkg' -print -quit)
          pkgutil --expand "$package" expanded.pkg
          test -s expanded.pkg/base.pkg/Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS package (${{ matrix.pkgarch }})
          path: "*.pkg"
          if-no-files-found: error

  build-packages-windows:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["x64", "x86", "arm64"]

    name: Package (Windows, ${{ matrix.pkgarch }})

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4

      - name: Build package
        run: sh contrib/msi/build-msi.sh ${{ matrix.pkgarch }}

      - name: Inspect package
        shell: bash
        run: test -n "$(find . -maxdepth 1 -name 'uqda-*.msi' -size +1M -print -quit)"

      - name: Install, exercise, and uninstall x64 package
        if: matrix.pkgarch == 'x64'
        shell: powershell
        run: |
          $msi = (Get-ChildItem -Path . -Filter "uqda-*-x64.msi" -File).FullName
          $version = sh contrib/semver/version.sh --bare
          ./contrib/msi/test-installed-msi.ps1 -MsiPath $msi -ExpectedVersion $version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows package (${{ matrix.pkgarch }})
          path: "*.msi"
          if-no-files-found: error

  build-router-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: edgerouter-x
            pkgarch: mipsel
            pkgtarget: edgeos2x
          - target: edgerouter-lite
            pkgarch: mips
            pkgtarget: edgeos2x
          - target: vyos-amd64
            pkgarch: amd64
            pkgtarget: vyos13
          - target: vyos-i386
            pkgarch: i386
            pkgtarget: vyos13

    name: Router package (${{ matrix.target }})

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build integrated router package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
          PKGTARGET: ${{ matrix.pkgtarget }}
        run: sh contrib/vyatta/generate.sh

      - name: Inspect package
        run: |
          package=$(find . -maxdepth 1 -name 'uqda-*.deb' -print -quit)
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.pkgarch }}"
          dpkg-deb --contents "$package" | grep 'usr/lib/systemd/system/uqda@.service'
          dpkg-deb --contents "$package" | grep 'templates/interfaces/uqda/node.def'
          dpkg-deb --contents "$package" | head -1 | grep '^drwxr-xr-x'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Router package (${{ matrix.target }})
          path: "uqda-${{ matrix.pkgtarget }}-*.deb"
          if-no-files-found: error
