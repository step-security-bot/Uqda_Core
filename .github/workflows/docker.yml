name: Docker Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/uqda/core

jobs:
  build-docker:
    name: Build Docker Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          file: ./contrib/docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          # Pull requests build only. Main publishes edge; release tags publish
          # immutable SemVer tags when a tag is pushed outside GITHUB_TOKEN.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify anonymous pull and executable
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          image="${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools inspect "$image"
          docker logout "$REGISTRY"
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 \
            --entrypoint /usr/bin/uqda "$image" -version | tee version.txt
          grep -F 'Build name: uqda' version.txt
