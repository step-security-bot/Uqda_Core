name: Stable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable SemVer tag (leave blank to use the newest release-notes file)
        required: false
      tested_prerelease:
        description: Prerelease tag validated on this exact commit (required for publication)
        required: true
  push:
    branches: [main]
    paths:
      - ".github/releases/v*.md"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  UQDA_VERSION: ${{ inputs.tag }}

jobs:
  quality-gate:
    name: Stable release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate stable version and notes
        run: |
          printf '%s\n' "$UQDA_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -f ".github/releases/${UQDA_VERSION}.md"
          test "$(sh contrib/semver/version.sh)" = "$UQDA_VERSION"
      - name: Documentation consistency
        run: python3 tests/documentation_test.py
      - name: Unit and handshake tests
        run: |
          go test ./...
          go test ./src/core -run=^$ -fuzz=FuzzVersionDecode -fuzztime=15s
      - name: Installer platform matrix
        env:
          UQDA_TEST_VERSION: ${{ env.UQDA_VERSION }}
        run: sh tests/install_test.sh
      - name: Shell syntax
        run: sh -n install.sh updater.sh uninstall.sh tests/install_test.sh tests/uninstall_test.sh
      - name: Uninstaller safety tests
        run: sh tests/uninstall_test.sh

  portable:
    name: Portable (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, goarch: amd64 }
          - { os: linux, arch: i386, goarch: "386" }
          - { os: linux, arch: arm64, goarch: arm64 }
          - { os: linux, arch: armv7, goarch: arm, goarm: "7" }
          - { os: linux, arch: mipsel, goarch: mipsle, gomips: softfloat }
          - { os: linux, arch: mips64, goarch: mips64 }
          - { os: freebsd, arch: amd64, goarch: amd64 }
          - { os: freebsd, arch: arm64, goarch: arm64 }
          - { os: openbsd, arch: amd64, goarch: amd64 }
          - { os: openbsd, arch: arm64, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release version
        run: test "$(sh contrib/semver/version.sh)" = "$UQDA_VERSION"
      - name: Build portable archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          ./build
          archive="uqda-${UQDA_VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir "$archive"
          cp uqda uqdactl install.sh updater.sh uninstall.sh README.md README_AR.md LICENSE NOTICE.md "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.os }}-${{ matrix.arch }}
          path: "uqda-*.tar.gz"
          if-no-files-found: error

  debian:
    name: Debian (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, mips, mipsel, armhf, armel, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and inspect package
        env:
          PKGARCH: ${{ matrix.arch }}
        run: |
          sh contrib/deb/generate.sh
          package=$(find . -maxdepth 1 -name 'uqda-*.deb' -print -quit)
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -E 'usr/bin/(uqda|uqdactl)$'
          dpkg-deb --contents "$package" | grep 'usr/share/uqda/uninstall.sh'
      - uses: actions/upload-artifact@v7
        with:
          name: debian-${{ matrix.arch }}
          path: "uqda-*.deb"
          if-no-files-found: error

  router:
    name: Router (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: edgerouter-x, arch: mipsel, package: edgeos2x }
          - { target: edgerouter-lite, arch: mips, package: edgeos2x }
          - { target: vyos-amd64, arch: amd64, package: vyos13 }
          - { target: vyos-i386, arch: i386, package: vyos13 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and inspect package
        env:
          PKGARCH: ${{ matrix.arch }}
          PKGTARGET: ${{ matrix.package }}
        run: |
          sh contrib/vyatta/generate.sh
          package=$(find . -maxdepth 1 -name 'uqda-*.deb' -print -quit)
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb --contents "$package" | grep 'usr/lib/systemd/system/uqda@.service'
          dpkg-deb --contents "$package" | grep 'usr/share/uqda/uninstall.sh'
          dpkg-deb --contents "$package" | grep 'templates/interfaces/uqda/node.def'
          dpkg-deb --contents "$package" | head -1 | grep '^drwxr-xr-x'
      - uses: actions/upload-artifact@v7
        with:
          name: router-${{ matrix.target }}
          path: "uqda-*.deb"
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Apple signing identities
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$APPLICATION_P12_BASE64"
          test -n "$INSTALLER_P12_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"

          application_p12="$RUNNER_TEMP/developer-id-application.p12"
          installer_p12="$RUNNER_TEMP/developer-id-installer.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/uqda-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLICATION_P12_BASE64" | base64 --decode > "$application_p12"
          printf '%s' "$INSTALLER_P12_BASE64" | base64 --decode > "$installer_p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"
          chmod 0600 "$application_p12" "$installer_p12" "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$application_p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security import "$installer_p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          application_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          installer_identity="$(security find-identity -v -p basic "$keychain" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          test -n "$application_identity"
          test -n "$installer_identity"

          echo "MACOS_APPLICATION_IDENTITY=$application_identity" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Build and inspect installer
        env:
          PKGARCH: ${{ matrix.arch }}
        run: |
          sh contrib/macos/create-pkg.sh
          package=$(find . -maxdepth 1 -name 'uqda-*.pkg' -print -quit)
          test -n "$package"
          if [ "$MACOS_SIGNING_ENABLED" != true ]; then
            case "$package" in *-unsigned.pkg) ;; *) exit 1 ;; esac
            echo "Apple signing credentials are not configured; publishing an explicitly unsigned package."
          fi
          pkgutil --expand "$package" expanded.pkg
          grep "version=\"${UQDA_VERSION#v}\"" expanded.pkg/Distribution
          test -s expanded.pkg/base.pkg/Payload
          pkgutil --payload-files "$package" | grep 'usr/local/share/uqda/uninstall.sh'
      - name: Notarize signed installer
        if: env.MACOS_SIGNING_ENABLED == 'true'
        run: |
          package=$(find . -maxdepth 1 -name 'uqda-*.pkg' -print -quit)
          pkgutil --check-signature "$package" | grep 'Developer ID Installer'
          xcrun notarytool submit "$package" \
            --key "$APPLE_NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          spctl --assess --type install --verbose=4 "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: "uqda-*.pkg"
          if-no-files-found: error
      - name: Remove Apple signing keychain
        if: ${{ always() && env.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: |
          version=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")
          echo "UQDA_VERSION=$version" >> "$GITHUB_ENV"
          echo "UQDA_VERSION_BARE=${version#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
      - name: Resolve Windows signing mode
        # WiX 3 candle/light are required by our MSI authoring.
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if [ "$SIGNPATH_ENABLED" = true ]; then
            for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG; do
              test -n "$(printenv "$name")" || { echo "Incomplete Windows signing configuration: $name" >&2; exit 1; }
            done
            echo "SignPath is configured; Windows release assets will be signed."
          else
            echo "SignPath is not configured; Windows release assets will be explicitly named unsigned."
          fi
      - name: Add runner WiX 3 tools to PATH
        shell: powershell
        run: |
          $bin = Join-Path $env:WIX 'bin'
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path (Join-Path $bin $tool))) { throw "Missing WiX 3 tool: $tool" }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows executables
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x64) goarch=amd64 ;;
            x86) goarch=386 ;;
            arm64) goarch=arm64 ;;
            *) exit 1 ;;
          esac
          GOOS=windows GOARCH="$goarch" CGO_ENABLED=0 ./build
      - name: Upload unsigned executables for SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-executables
        uses: actions/upload-artifact@v7
        with:
          name: internal-unsigned-windows-executables-${{ matrix.arch }}
          path: |
            uqda.exe
            uqdactl.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows executables with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed-executables
      - name: Restore and verify signed executables
        if: env.SIGNPATH_ENABLED == 'true'
        shell: powershell
        run: |
          foreach ($name in @("uqda.exe", "uqdactl.exe")) {
            $signed = Get-ChildItem "${env:RUNNER_TEMP}\signed-executables" -Recurse -File -Filter $name |
              Select-Object -First 1
            if (-not $signed) { throw "SignPath did not return $name" }
            Copy-Item $signed.FullName (Join-Path $env:GITHUB_WORKSPACE $name) -Force
          }
          ./contrib/msi/verify-authenticode.ps1 -Path @("uqda.exe", "uqdactl.exe")
      - name: Build installer around signed executables
        shell: bash
        env:
          UQDA_USE_PREBUILT: "1"
        run: |
          sh contrib/msi/build-msi.sh "${{ matrix.arch }}"
          sh tests/msversion_test.sh
          sh contrib/msi/msversion.sh
          test -s "uqda-${UQDA_VERSION#v}-${{ matrix.arch }}.msi"
      - name: Upload unsigned installer for SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: internal-unsigned-windows-installer-${{ matrix.arch }}
          path: uqda-${{ env.UQDA_VERSION_BARE }}-${{ matrix.arch }}.msi
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed-installer
      - name: Restore and verify signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        shell: powershell
        run: |
          $name = "uqda-${env:UQDA_VERSION_BARE}-${{ matrix.arch }}.msi"
          $signed = Get-ChildItem "${env:RUNNER_TEMP}\signed-installer" -Recurse -File -Filter $name |
            Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return $name" }
          Copy-Item $signed.FullName (Join-Path $env:GITHUB_WORKSPACE $name) -Force
          ./contrib/msi/verify-authenticode.ps1 -Path $name
      - name: Mark unsigned installer explicitly
        if: env.SIGNPATH_ENABLED != 'true'
        shell: powershell
        run: |
          $source = "uqda-${env:UQDA_VERSION_BARE}-${{ matrix.arch }}.msi"
          $target = "uqda-${env:UQDA_VERSION_BARE}-${{ matrix.arch }}-unsigned.msi"
          Rename-Item $source $target
      - name: Install, exercise, and uninstall x64 package
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $name = if ($env:SIGNPATH_ENABLED -eq "true") {
            "uqda-${env:UQDA_VERSION_BARE}-x64.msi"
          } else {
            "uqda-${env:UQDA_VERSION_BARE}-x64-unsigned.msi"
          }
          $arguments = @{
            MsiPath = $name
            ExpectedVersion = "${env:UQDA_VERSION_BARE}"
          }
          if ($env:SIGNPATH_ENABLED -eq "true") {
            $arguments.RequireSignature = $true
          }
          ./contrib/msi/test-installed-msi.ps1 @arguments
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: "uqda-*.msi"
          if-no-files-found: error

  vendored-source:
    name: Vendored source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Create vendored source archive
        run: |
          go mod vendor
          archive="uqda-${UQDA_VERSION}-vendored-source"
          mkdir "$archive"
          tar --exclude-vcs --exclude="$archive" -cf - . | tar -xf - -C "$archive"
          tar -czf "$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: vendored-source
          path: "uqda-*-vendored-source.tar.gz"
          if-no-files-found: error

  release-tools:
    name: Release installation tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - name: Test installer scripts
        env:
          UQDA_TEST_VERSION: ${{ env.UQDA_VERSION }}
        run: |
          sh -n install.sh updater.sh uninstall.sh tests/install_test.sh tests/uninstall_test.sh
          sh tests/install_test.sh
          sh tests/uninstall_test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-tools
          path: |
            install.sh
            updater.sh
            uninstall.sh
          if-no-files-found: error

  publish:
    name: Publish signed stable release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [quality-gate, portable, debian, router, macos, windows, vendored-source, release-tools]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Require tested prerelease and full CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_PRERELEASE: ${{ inputs.tested_prerelease }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 tests/release_gate.py
      - name: Resolve release version
        shell: bash
        run: echo "UQDA_VERSION=$(sh contrib/semver/release-version.sh "${UQDA_VERSION:-}")" >> "$GITHUB_ENV"
      - name: Validate stable tag and notes
        run: |
          printf '%s\n' "$UQDA_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -f ".github/releases/${UQDA_VERSION}.md"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: container_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uqda/core
          tags: |
            type=raw,value=${{ env.UQDA_VERSION }}
            type=semver,pattern={{version}},value=${{ env.UQDA_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.UQDA_VERSION }}
            type=semver,pattern={{major}},value=${{ env.UQDA_VERSION }}
            type=raw,value=latest
      - name: Build and publish multi-platform container package
        id: container_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./contrib/docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            UQDA_VERSION=${{ env.UQDA_VERSION }}
          push: true
          tags: ${{ steps.container_meta.outputs.tags }}
          labels: ${{ steps.container_meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Verify public package and version
        env:
          CONTAINER_DIGEST: ${{ steps.container_build.outputs.digest }}
        run: |
          image="ghcr.io/uqda/core@${CONTAINER_DIGEST}"
          docker buildx imagetools inspect "$image"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 \
            --entrypoint /usr/bin/uqda "$image" -version | tee container-version.txt
          grep -F "Build version: ${UQDA_VERSION#v}" container-version.txt
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and inventory
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.sigstore.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -ge 31
          cat SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifest with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --bundle release-assets/SHA256SUMS.sigstore.json \
            release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS.sigstore.json
      - name: Verify checksum publisher identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-beta.yml@refs/heads/main"
          cosign verify-blob release-assets/SHA256SUMS \
            --bundle release-assets/SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$UQDA_VERSION" >/dev/null 2>&1; then
            echo "Release $UQDA_VERSION already exists; keeping its published assets immutable."
          else
            gh release create "$UQDA_VERSION" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UQDA Core $UQDA_VERSION" \
              --notes-file ".github/releases/${UQDA_VERSION}.md"
          fi
