name: UQDA

on:
  push:
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Documentation consistency
        run: python3 tests/documentation_test.py
      - name: Windows installer isolation invariants
        run: python3 tests/windows_isolation_test.py
      - name: Uninstaller tests
        run: |
          sh -n uninstall.sh tests/uninstall_test.sh
          sh tests/uninstall_test.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  codeql:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  vulnerability-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Scan reachable dependencies
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-package: ./...

  handshake-fuzz-smoke:
    name: Handshake fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Fuzz handshake parser
        run: go test ./src/core -run=^$ -fuzz=FuzzVersionDecode -fuzztime=15s

  e2e-linux:
    name: E2E mesh (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: two-node, script: 2node.sh }
          - { name: multi-hop, script: 3node-routing.sh }
          - { name: failover, script: failover.sh }
          - { name: loss-latency, script: loss-latency.sh }
          - { name: secure-required, script: secure-required.sh }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build UQDA
        run: ./build
      - name: Check namespace test prerequisites
        run: |
          command -v ip
          command -v tc
          command -v ping
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: Build legacy protocol fixture
        run: go build -o /tmp/uqda-e2e-legacy-peer ./tests/e2e/legacy_peer.go
      - name: Run ${{ matrix.name }} E2E scenario
        run: sudo env UQDA_LEGACY_PEER_BIN=/tmp/uqda-e2e-legacy-peer bash "tests/e2e/${{ matrix.script }}"

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25.13", "1.26"]

    name: Build & Test (Linux, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25.13", "1.26"]

    name: Build & Test (Windows, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25.13", "1.26"]

    name: Build & Test (macOS, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  homebrew-cask:
    name: Homebrew Cask
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Cask release metadata
        run: |
          expected_version="$(sh contrib/semver/release-version.sh)"
          expected_version="${expected_version#v}"
          expected_sha="$(shasum -a 256 install.sh | awk '{print $1}')"
          grep -Fx "  version \"${expected_version}\"" Casks/uqda.rb
          grep -Fx "  sha256 \"${expected_sha}\"" Casks/uqda.rb
          grep -F 'releases/download/v#{version}/install.sh' Casks/uqda.rb
          grep -F '"--version", "v#{version}"' Casks/uqda.rb
          grep -F '"/usr/local/share/uqda/uninstall.sh"' Casks/uqda.rb
      - name: Validate Cask syntax and style
        run: |
          ruby -c Casks/uqda.rb
          tap_dir="$(brew --repository)/Library/Taps/uqda/homebrew-core"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew style --cask uqda/core/uqda

  build-freebsd:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25.13", "1.26"]
        goos:
          - freebsd
          - openbsd

    name: Build (Cross ${{ matrix.goos }}, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}

  tests-ok:
    name: All tests passed
    needs: [lint, codeql, vulnerability-scan, handshake-fuzz-smoke, e2e-linux, build-linux, build-windows, build-macos, homebrew-cask, build-freebsd]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check all tests passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
